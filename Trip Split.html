<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Trip Split</title>
<style>
:root{--bg:#f6f7f4;--card:#fff;--tx:#1d2a22;--mu:#6b786f;--ac:#1f7a4d;--bd:#dfe4dc;--neg:#c0392b;--pos:#1f7a4d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111613;--card:#1b231e;--tx:#e8efe9;--mu:#92a198;--ac:#4cc38a;--bd:#2b362f;--neg:#ff7b6b;--pos:#4cc38a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,sans-serif}
header{padding:16px;display:flex;justify-content:space-between;align-items:center}
h1{font-size:20px;margin:0}button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:8px 12px}
button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
main{padding:0 16px 32px;max-width:640px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;gap:8px}
.mu{color:var(--mu);font-size:13px}.big{font-size:22px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border:1px solid var(--bd);border-radius:20px;padding:3px 10px;font-size:13px}
h2{font-size:14px;color:var(--mu);text-transform:uppercase;letter-spacing:.05em;margin:20px 0 8px}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap}
th,td{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:right}th:first-child,td:first-child{text-align:left}
.dd{width:100%;text-align:left;margin-top:10px}.panel{border:1px solid var(--bd);border-radius:10px;margin-top:6px;padding:4px 10px}.panel label{display:flex;align-items:center;gap:10px;padding:9px 0;font-size:16px}.panel input{width:20px;height:20px;margin:0}
#set{display:none}#set.on{display:block}
input,textarea{width:100%;font:inherit;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);margin:6px 0}
</style>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#1f7a4d">
</head><body>
<header><h1>Trip Split</h1><button id="gear">Sync ⚙</button></header>
<main>
<div id="set" class="card">
<b>Update data</b>
<p class="mu">Option 1: In Google Sheets use File → Share → Publish to web → CSV, paste the link (needs this page hosted on your own site).</p>
<input id="url" placeholder="Published CSV link">
<button class="p" id="sync">Sync from link</button>
<p class="mu">Option 2: select all cells in the sheet, copy, and paste here.</p>
<textarea id="paste" rows="4" placeholder="Paste copied sheet cells"></textarea>
<button class="p" id="imp">Import pasted</button> <button id="rst">Reset sample</button>
<div id="msg" class="mu"></div>
</div>
<div id="out"></div>
</main>
<script>
var SAMPLE={people:["Như","A Tín","Ngọc","David","Bình Minh","Hân"],rows:[
{a:"Vegas stay",t:0,p:"A Tín",s:[0,0,0,0,0,0]},
{a:"Hurricane stay",t:0,p:"Như",s:[0,0,0,0,0,0]},
{a:"Car rental",t:258.29,p:"A Tín",s:[51.66,51.66,0,51.66,51.66,51.66]},
{a:"Drive to ORD",t:50,p:"David",s:[0,0,0,16.67,16.67,16.67]},
{a:"Drive to ORD",t:40,p:"Han",s:[0,0,0,13.33,13.33,13.33]}]};
var D=JSON.parse(JSON.stringify(SAMPLE)),$=function(i){return document.getElementById(i)};
try{var sv=localStorage.getItem("split");if(sv)D=JSON.parse(sv);var u=localStorage.getItem("splitUrl");if(u)$("url").value=u}catch(e){}
function m(n){return(n<0?"-":"")+"$"+Math.abs(n).toFixed(2)}
function num(s){var n=parseFloat(String(s||"").replace(/[$,\s]/g,""));return isNaN(n)?0:n}
function norm(s){return String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/gi,"d").toLowerCase().trim()}
function esc(s){return String(s).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})}
function csv(t){var r=[],row=[],c="",q=0;for(var i=0;i<t.length;i++){var ch=t[i];
if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=0}else c+=ch}
else if(ch=='"')q=1;else if(ch==","){row.push(c);c=""}
else if(ch=="\n"){row.push(c);r.push(row);row=[];c=""}else if(ch!="\r")c+=ch}
row.push(c);r.push(row);return r}
function build(g){var h=g[0],k=h.length;if(k<5)throw 0;
var people=h.slice(4).map(function(x){return x.trim()}).filter(Boolean);var rows=[];
for(var i=1;i<g.length;i++){var r=g[i];var a=(r[0]||"").trim();if(!a||/^subtotal/i.test(a))continue;
var sv=people.map(function(_,j){return num(r[4+j])});var us=(r[3]||"").split(",").map(function(x){return norm(x)}).filter(Boolean);var u=people.filter(function(p){return us.indexOf(norm(p))>=0});if(!u.length)u=people.filter(function(_,j){return sv[j]>0});rows.push({a:a,t:num(r[1]),p:(r[2]||"").trim(),u:u,s:sv})}
return{people:people,rows:rows}}
function say(t){$("msg").textContent=t}
function save(d){D=d;try{localStorage.setItem("split",JSON.stringify(d))}catch(e){}render()}
$("gear").onclick=function(){$("set").classList.toggle("on")};
$("imp").onclick=function(){try{var t=$("paste").value;var g=t.split("\n").filter(function(l){return l.trim()}).map(function(l){return l.split("\t")});save(build(g));say("Imported "+D.rows.length+" rows")}catch(e){say("Couldn't read that. Copy the whole table including headers.")}};
$("sync").onclick=function(){var u=$("url").value.trim();if(!u)return;try{localStorage.setItem("splitUrl",u)}catch(e){}
say("Syncing…");fetch(u).then(function(r){return r.text()}).then(function(t){save(build(csv(t)));say("Synced "+D.rows.length+" rows")}).catch(function(){say("Sync failed. Host this page on your own site or use paste.")})};
$("rst").onclick=function(){save(JSON.parse(JSON.stringify(SAMPLE)));say("Reset")};
function render(){var P=D.people,R=D.rows,tot=0,sh=P.map(function(){return 0}),paid=P.map(function(){return 0});
R.forEach(function(r){if(!r.u)r.u=P.filter(function(_,j){return r.s[j]>0});r.s=P.map(function(p){return r.u.indexOf(p)>=0?r.t/r.u.length:0});tot+=r.t;r.s.forEach(function(v,j){sh[j]+=v});var ix=P.findIndex(function(x){return norm(x)==norm(r.p)});if(ix>=0)paid[ix]+=r.t});
var h='';
h+='<h2>Who owes who</h2><div class="card">';
var dm=P.map(function(){return P.map(function(){return 0})});
R.forEach(function(r){var ix=P.findIndex(function(x){return norm(x)==norm(r.p)});if(ix<0||!r.u.length)return;r.u.forEach(function(p){var j=P.indexOf(p);if(j>=0&&j!==ix)dm[j][ix]+=r.t/r.u.length})});
P.forEach(function(p,j){var ls='';P.forEach(function(q,k){var n=dm[j][k]-dm[k][j];if(n>=0.005)ls+='<div class="row" style="padding:3px 0"><span>owes <b>'+esc(q)+'</b></span><b class="neg">'+m(n)+'</b></div>'});h+='<div style="padding:8px 0;border-bottom:1px solid var(--bd)"><div class="row"><b>'+esc(p)+'</b><span>Total spent <b>'+m(sh[j])+'</b></span></div>'+(ls||'<div class="mu">Doesn\'t owe anyone</div>')+'</div>'});
h+='</div><h2>Activities</h2>';
R.forEach(function(r,i){var ch=r.s.map(function(v,j){return v?'<span class="chip">'+esc(P[j])+' '+m(v)+'</span>':""}).join("");
var pn=OPEN===i?'<div class="panel">'+P.map(function(p,j){return'<label><input type="checkbox" class="ck" data-i="'+i+'" data-p="'+j+'"'+(r.u.indexOf(p)>=0?' checked':'')+'> '+esc(p)+'</label>'}).join("")+'</div>':'';
h+='<div class="card"><div class="row"><b>'+esc(r.a)+'</b><b>'+m(r.t)+'</b></div><div class="mu">Paid by '+esc(r.p||"—")+'</div><div class="chips">'+(ch||'<span class="mu">Nobody selected</span>')+'</div><button class="dd" data-i="'+i+'">Who used this ('+r.u.length+') '+(OPEN===i?'▴':'▾')+'</button>'+pn+'<button class="rm" data-i="'+i+'" style="width:100%;margin-top:8px;color:var(--neg)">'+(CONF===i?'Tap again to confirm removal':'Remove activity')+'</button></div>'});
h+='<div class="card"><b>Add activity</b><input id="an" placeholder="Activity name"><input id="at" type="number" inputmode="decimal" step="0.01" min="0" placeholder="Total $"><div class="mu" style="margin-top:6px">Who paid</div><select id="ap" style="width:100%;font:inherit;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);margin:6px 0">'+P.map(function(p){return'<option>'+esc(p)+'</option>'}).join("")+'</select><div class="mu" style="margin-top:6px">Who used this</div><div class="panel">'+P.map(function(p,j){return'<label><input type="checkbox" class="nu" data-p="'+j+'"'+((NU||P).indexOf(p)>=0?' checked':'')+'> '+esc(p)+'</label>'}).join("")+'</div><button class="p" id="addb" style="width:100%;margin-top:8px">+ Add activity</button>'+(FM?'<div class="mu" style="margin-top:6px">'+esc(FM)+'</div>':'')+'</div>';
h+='<h2>Full table</h2><div class="card tw"><table><tr><th>Activity</th><th>Total</th><th>Paid</th>'+P.map(function(p){return"<th>"+esc(p)+"</th>"}).join("")+"</tr>";
R.forEach(function(r){h+="<tr><td>"+esc(r.a)+"</td><td>"+m(r.t)+"</td><td>"+esc(r.p)+"</td>"+r.s.map(function(v){return"<td>"+m(v)+"</td>"}).join("")+"</tr>"});
h+='<tr><th>Total</th><th>'+m(tot)+'</th><th></th>'+sh.map(function(v){return"<th>"+m(v)+"</th>"}).join("")+"</tr></table></div>";
var kp=["an","at","ap"].map(function(i){var e=$(i);return e?e.value:""});$("out").innerHTML=h;["an","at","ap"].forEach(function(i,k){if(kp[k])$(i).value=kp[k]})}
var OPEN=-1,CONF=-1,NU=null,FM="";
function postRow(r){return""}
$("out").onclick=function(e){if(e.target.id==="addb"){var nm=$("an").value.trim();if(!nm){$("an").focus();return}var us=NU||D.people.slice(),row={a:nm,t:num($("at").value),p:$("ap").value,s:[],u:us.slice()};D.rows.push(row);$("an").value="";$("at").value="";OPEN=-1;FM=postRow(row);save(D);return}var rb=e.target.closest(".rm");if(rb){var k=+rb.dataset.i;if(CONF===k){D.rows.splice(k,1);CONF=-1;OPEN=-1;save(D)}else{CONF=k;render()}return}CONF=-1;var b=e.target.closest(".dd");if(b){var i=+b.dataset.i;OPEN=OPEN===i?-1:i;render()}};
$("out").onchange=function(e){var c=e.target;if(c.classList.contains("nu")){NU=[].slice.call(document.querySelectorAll(".nu")).filter(function(x){return x.checked}).map(function(x){return D.people[+x.dataset.p]});return}if(c.classList.contains("ck")){var r=D.rows[+c.dataset.i],p=D.people[+c.dataset.p],k=r.u.indexOf(p);if(c.checked&&k<0)r.u.push(p);if(!c.checked&&k>=0)r.u.splice(k,1);save(D)}};
render();
</script>
<script>if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js')</script>
</body></html>
